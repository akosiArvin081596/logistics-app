name: CI

# Runs on every PR into main and on every push to main (so the merge commit
# itself is verified, not just the branch that fed it — a green PR can still
# produce a red merge when two PRs interact).
#
# ⚠️ The push run GATES PRODUCTION. Branch protection does not require a PR to
# be up to date with main, so the commit a merge creates may be a combination
# no PR run tested. deploy.yml's staging job waits for THIS workflow's
# `check · unit · build` on the pushed commit (scripts/deploy/wait-for-ci.sh)
# and production deploys only once it passed. Keep the push trigger and the
# job name. That job (`verify`) is the verdict: it needs every other job here
# and passes only when all of them passed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A PR: one run per branch, and a new push supersedes the previous run rather
# than racing it. Safe to cancel: CI only reads, so a half-finished run leaves
# nothing behind (the deploy workflow deliberately does NOT do this).
# Anything else (a push to main, a manual run): one group per event AND commit,
# and nothing is cancelled. A quick second merge never cancels the first
# merge's run, and a manual run of the same commit never cancels its push run:
# production waits for each pushed commit's own verdict, and a cancelled run
# would leave that commit undeployed.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The unit runners in parts, side by side, each on its own runner: one after
  # another they took ~130 s of a ~3-minute job. scripts/run-unit-tests.js
  # deals the parts round-robin over the sorted runners, so each runner is in
  # exactly one part (scripts/test-release-gate.js §4 proves it). The number of
  # parts is the length of `part` (strategy.job-total): parts are 1..n.
  unit:
    name: unit · part ${{ matrix.part }} of ${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Every part runs to the end, so one part's failure never hides another's.
      fail-fast: false
      matrix:
        part: [1, 2, 3]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # ⚠️ The version here is NOT a default — it is pinned via .nvmrc to the
      # Node the VPS actually executes this app with, and as of 2026-08-25 that
      # is 22.23.2 for BOTH logistics-app and logisx-staging (pm2 `interpreter`
      # → /opt/node22/bin/node; see ecosystem.config.js).
      #
      # ⚠️ The SYSTEM node on that box is still 20.20.1 and is NOT ours — it is
      # apt/nodesource-managed and shared by ~23 other clients' processes. Do
      # not "align" this file to it: pm2 decides what runs this app, and the
      # answer is 22. Testing on a different major than production is how a
      # post-20 API call ships green and throws on the box.
      #
      # This moved from 20 → 22 because puppeteer 25 requires >=22.12, and
      # puppeteer 25 is the ONLY fix for the extract-zip advisory (no patched
      # extract-zip exists; 2.0.1 is the latest and is itself vulnerable).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # `npm ci`: it fails on a lockfile drifted from its package.json, and its
      # postinstall installs client/ with `npm ci` too (the lint · build job
      # below verifies the client lockfile on its own as well).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The standalone runners. Hermetic — :memory:/mkdtemp only, no network,
      # no fixtures, no app.db. This job's part of them (UNIT_TEST_SHARD), 4 at
      # a time on this 4-vCPU runner (run-unit-tests.js's default; the isolation
      # audit is in its header), timing-sensitive ones alone after.
      #
      # ⚠️ UNIT_TEST_SKIP_TIMING drops the timing-sensitive runners (currently
      # exactly one: test-pdf-cold-start.js, which launches Chromium, induces an
      # event-loop stall and asserts on wall-clock budgets around the recovery).
      # Its old flake was a race inside its own §1, not machine load, and is
      # fixed (#492; measured 12/12 idle and 12/12 under load on a 15-core Mac,
      # see scripts/run-unit-tests.js). It stays out of CI because a 3 s
      # navigation budget on a GitHub-hosted runner's two shared cores is
      # untested, and a pipeline nobody trusts is worse than no pipeline.
      #
      # The skip is printed at the start AND end of the run and named in the
      # `verify` job's summary below — never silent. It means the PDF cold-start path is NOT
      # covered here: run `npm run test:unit` locally (no env var) before
      # touching lib/pdf-browser.js.
      - name: Unit / guard runners
        env:
          UNIT_TEST_SKIP_TIMING: "1"
          UNIT_TEST_SHARD: ${{ matrix.part }}/${{ strategy.job-total }}
        run: npm run test:unit

  # Both lockfiles, the syntax check, the tripwire, and the client build with
  # the deploy's whole-build check on it.
  build:
    name: lint · build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The same Node as the unit job (see the note there).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # `npm ci` (not `npm install`) is itself a test: it FAILS if either
      # lockfile has drifted from its package.json, which is exactly the class
      # of breakage that otherwise only shows up mid-deploy on the VPS.
      #
      # The root `npm ci`'s `postinstall` already runs `npm ci` in client/ (it
      # picks `npm ci` there whenever the root ran `npm ci`), so a client
      # lockfile out of sync fails the root step. The explicit client step
      # below repeats the install; it costs a few seconds.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # (Historical note: on the old Node 20 this step printed an EBADENGINE
      # warning for pdfjs-dist@6.2.108, which declares `node >=22.13.0 || >=24`.
      # The move to 22.23.2 satisfies it and the warning is gone.)
      - name: Install client dependencies (verifies client lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: client

      # server.js is ~60k lines in ONE file. A syntax error anywhere in it does
      # not degrade a feature, it stops the entire application from booting —
      # so this is the cheapest, highest-value gate in the pipeline and it runs
      # first. `npm run lint` is `node --check` over server.js and every
      # .js/.mjs/.cjs file in lib/ and scripts/, about a second. (`npm run
      # check` is lint plus the unit runners, the local pre-push check; CI runs
      # the two in separate jobs so the unit runners run once.)
      - name: Syntax check (server.js, lib, scripts)
        run: npm run lint

      # ⚠️ Tripwire. test-suite.js must never run in CI: it needs a live server,
      # it WRITES (test 46 logs an expense), it defaults to port 3000 — which is
      # PRODUCTION on the VPS — and with no SPREADSHEET_ID override server.js
      # falls through to the live Dispatch Management sheet. If a future edit
      # adds it to a workflow, fail here rather than bill it to the client's
      # real books.
      - name: Refuse to run the writing HTTP suite in CI
        run: |
          # ⚠️ Comments are stripped BEFORE matching, and the error message below
          # deliberately does not spell the filename out. The first version of
          # this step grepped the raw workflow files for the bare name — and
          # matched its own explanatory comments and its own error string, so it
          # fired on every run and CI was red 100% of the time. A tripwire that
          # always fires is indistinguishable from a broken build.
          if cat .github/workflows/*.yml | sed 's/#.*$//' | grep -q 'test-suite'; then
            echo "::error::A workflow invokes the root HTTP suite. That harness WRITES (test 46 logs an expense), defaults to port 3000 which is PRODUCTION on the VPS, and with no SPREADSHEET_ID override writes to the live Dispatch Management sheet. See README.md, Tests."
            exit 1
          fi
          echo "ok: no workflow invokes the root HTTP suite"

      - name: Build client
        run: npm run build:client

      # A deploy swaps a client build in only when client_whole, from the
      # client-build block of scripts/deploy/remote-deploy.sh, calls it whole:
      # an index.html naming /assets bundle files, every one of them there and
      # non-empty. Run here on this real Vite build, so a change to Vite's
      # output or to that check that would leave every deploy unbuilt fails
      # on the PR instead. The block is read as the refresh scripts read it,
      # and run only when it arrived whole, ending on its end marker.
      - name: The deploy's whole-build check accepts this build
        run: |
          block=$(sed -n '/^# >>> client-build/,/^# <<< client-build/p' scripts/deploy/remote-deploy.sh)
          case "$block" in
            *'client_whole() {'*$'\n''# <<< client-build') ;;
            *) echo "::error::could not read the client-build block from scripts/deploy/remote-deploy.sh"; exit 1 ;;
          esac
          eval "$block"
          if ! client_whole client/dist; then
            echo "::error::the deploy's whole-build check (client_whole) refuses this build: client/dist has no index.html, or its index.html names an /assets bundle that is missing or empty, or names none. Every deploy of this commit would end unbuilt."
            exit 1
          fi
          echo "ok: client_whole accepts client/dist"

      # A build that emits nothing still "succeeds". Express serves client/dist,
      # and without client/dist/index.html every page is a 503 "being updated"
      # page while the API still answers, so an empty dist would deploy as a
      # running server with no app.
      - name: Assert the build actually produced a bundle
        run: |
          test -f client/dist/index.html || { echo "::error::client/dist/index.html missing after build"; exit 1; }
          count=$(find client/dist/assets -type f 2>/dev/null | wc -l)
          echo "client/dist/assets: $count files"
          [ "$count" -gt 0 ] || { echo "::error::client/dist/assets is empty"; exit 1; }

  # THE verdict: branch protection requires this check by name, and
  # wait-for-ci.sh waits for it before production deploys. It needs every
  # other job and passes only when each of them passed.
  #
  # ⚠️ `if: always()` is load-bearing. Without it, a failed part makes GitHub
  # SKIP this job, and a skipped required check counts as passed: the PR would
  # merge with failing runners. With it, this job runs after any outcome and
  # fails unless every result it reads is `success` (failure, cancelled and
  # skipped all fail it).
  #
  # Its 5 minutes after a part's 10 keep the longest chain at 15, which
  # deploy.yml's 20-minute CI wait outlasts.
  verify:
    name: check · unit · build
    needs: [unit, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Every unit part and the lint · build job passed
        env:
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "unit parts: ${UNIT:-none} · lint · build: ${BUILD:-none}"
          if [ "$UNIT" = success ] && [ "$BUILD" = success ]; then
            echo "ok: every unit part and the lint · build job passed"
            exit 0
          fi
          echo "::error::CI did not pass: unit parts ${UNIT:-none}, lint · build ${BUILD:-none}. Any result but success fails this required check."
          exit 1

      - name: Note what this run did not cover
        if: always()
        # A quoted heredoc: the backticks are Markdown, never command substitution.
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### CI coverage note

          Timing-sensitive runners are **skipped on CI** and are not covered by this green check:

          - `scripts/test-pdf-cold-start.js` — induces an event-loop stall and asserts on the recovery; unreliable on a 2-core shared runner.

          Run `npm run test:unit` locally (without `UNIT_TEST_SKIP_TIMING`) to cover it — required before changing `lib/pdf-browser.js` or the PDF render path.
          SUMMARY
