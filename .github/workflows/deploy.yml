name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# PUSH TO main  ->  staging, then PRODUCTION automatically once the staging job
#                   passed. Nobody approves; the checks below are the gate.
# Manual dispatch ->  whichever single target you pick (and any ref, for rollback).
#
# On a push the staging job is the whole pre-production verdict, three parts in
# one job:
#   1. the deploy itself (.github/actions/vps-deploy: restart proven, smoke on
#      the box, verified record), as before;
#   2. the STAGING SMOKE (scripts/deploy/staging-smoke.sh): read-only and signed
#      out, through staging's public edge: health, the login page, every
#      /assets bundle file index.html names, an API call that must answer 401
#      without a session, and the live-update handshake (own Origin 200,
#      foreign Origin 403);
#   3. CI ON MAIN (scripts/deploy/wait-for-ci.sh): ci.yml's push run of
#      `check · unit · build` on this exact commit must succeed. Branch
#      protection does not require a PR to be up to date with main, so the
#      commit a merge creates can be a combination no PR run tested; this is
#      the first CI verdict on it. Bounded at 20 min; anything but success
#      leaves production undeployed.
# Before the smoke, the job checks that staging serves THIS run's commit: a
# no-op deploy (a newer commit already live there) would let the smoke vouch
# for another build.
#
# A MANUAL production deploy (workflow_dispatch) runs the production job alone,
# so it carries its own gate (scripts/deploy/dispatch-gate.js): the commit its
# ref names must have passed the staging job of a push-triggered Deploy run,
# which every commit main deployed before did, so rollbacks work. override=true
# deploys anyway and records a warning.
# `production` needs `staging` and runs only when it SUCCEEDED, so it deploys
# after all three, with no reviewer. It keeps `environment: production`, so
# every production deploy is still recorded as a deployment of that environment.
#
# ⚠️ WHY THE SMOKE AND THE CI WAIT ARE STEPS OF THE STAGING JOB, NOT JOBS.
#   - Race-free: the staging job holds the `deploy-staging` slot from its
#     deploy to its last step, so no other run's staging deploy (another merge,
#     a re-run, a manual staging dispatch) can land between the deploy and the
#     smoke. A separate smoke job would queue for the slot again after the
#     staging job released it, behind any staging deploy queued meanwhile, and
#     staging exposes no public "which commit is this" answer to tell them apart.
#   - The drift heal honours them for free: scripts/deploy/drift-gate.js heals
#     only a commit whose `staging` JOB passed, so a commit whose smoke or CI on
#     main failed alarms instead of healing.
#   The cost: the staging slot stays held until CI on main answers (CI starts on
#   the same push, so usually a minute or two past the deploy).
#
# ⚠️ NO JOB WAITS ON A HUMAN. The production environment has no required
# reviewer, and every wait is bounded: each job has timeout-minutes, the CI
# wait its own 20 min, and a queue only ever waits for jobs that are bounded
# themselves. From 2026-09-25 until the reviewer was removed, a production job
# waiting for approval held the production queue (#428 sat 22 h). Re-adding a
# reviewer brings that back; see .github/workflows/README.md.
#
# Once production runs, three things still carry the safety:
#
#   1. staging is a hard prerequisite (`needs:`) — same box, same pm2, same Node
#      — so a merge is always exercised somewhere before production sees it.
#   2. every deploy smoke-checks; production also checks the public edge.
#   3. if production's smoke or edge check fails it ROLLS ITSELF BACK to the
#      last live or verified commit (never merely the one a failed deploy left
#      checked out), then re-verifies. A bad merge cannot leave production down
#      waiting to be noticed.
#
# On a push, BOTH jobs deploy exactly the commit that triggered the run
# (`sha: github.sha`), so production receives the very commit that staging
# verified in the same run.
#
# The remote halves live in scripts/deploy/*.sh — in the repo, not inline here,
# so both jobs share ONE reviewable copy and cannot drift apart.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]
      ref:
        description: "Branch, tag or full SHA to deploy: letters, digits and ._/- only (rollback: pass an older SHA)"
        required: false
        default: main
        type: string
      override:
        description: "Production only: deploy even though the commit never passed staging in a push-triggered Deploy run (recorded as a warning)"
        required: false
        default: false
        type: boolean

# ⚠️ TWO QUEUES, ONE PER ENVIRONMENT (since 2026-10-03): each job carries its
# own concurrency group, and the workflow has none.
#   - `deploy-staging` queues the staging jobs. Each merge deploys staging as
#     soon as the staging job before it has finished, its smoke and CI wait
#     included.
#   - `deploy-refs/heads/main` queues the production jobs, and deploy-drift.yml's
#     HEAL job uses the SAME literal group. Concurrency groups are
#     repository-wide, so a heal waits for an in-flight production deploy, and a
#     production deploy for a heal. The drift CHECK is read-only and has its own
#     group (deploy-drift.yml), so it never sits in this queue.
# A staging and a production deploy may run at the same time. They touch
# different directories and pm2 processes, and the box lock is per directory
# (scripts/deploy/remote-deploy.sh), so they never contend.
#
# ⚠️ cancel-in-progress is FALSE on purpose. Cancelling mid-flight can leave the
# box between `git pull` and `pm2 restart`. Queue instead; a deploy is <1 min.
#
# ⚠️ `queue: max` (GitHub, 2026-05) keeps up to 100 jobs waiting in FIFO order.
# The default holds ONE pending job and CANCELS it when another arrives, which
# could cancel a queued deploy. The trade-off: a burst of merges deploys every
# commit in turn rather than only the last one.
# actionlint 1.7.12 predates the key and reports it as unexpected; GitHub
# accepts it.

permissions:
  contents: read

jobs:
  staging:
    # ⚠️ scripts/deploy/drift-gate.js finds this job BY THIS NAME to decide
    # whether a drift heal may deploy a commit. Rename it and every heal fails
    # closed until drift-gate.js moves with it (scripts/test-drift-gate.js pins
    # the two together).
    name: staging
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    # The deploy and its record step (ssh-retry.sh's transport budget is ~5 min
    # per connection, the deploy itself about 1), the smoke (2 min at most) and
    # the CI wait (20 min at most).
    timeout-minutes: 40
    # Staging's own queue (see the note above `permissions`).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max
    # Job-level permissions replace the workflow's: checkout reads the repo,
    # and the CI wait reads check runs.
    permissions:
      contents: read
      checks: read
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v5
      - id: deploy
        uses: ./.github/actions/vps-deploy
        with:
          dir: /var/www/logisx-staging
          pm2: logisx-staging
          ref: ${{ github.event.inputs.ref || 'main' }}
          # On a push: exactly the commit that triggered this run. On a manual
          # dispatch: empty, so `ref` means what it always meant.
          sha: ${{ github.event_name == 'push' && github.sha || '' }}
          # staging is the canary — leave a failure in place to inspect.
          rollback_on_failure: "false"
          ssh_key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}

      # Push runs only: they are the ones production follows. A manual staging
      # dispatch may deploy an older ref, which the checks below were not
      # written for (the foreign-Origin refusal, for one, is newer than some).
      #
      # The smoke vouches for whatever staging serves, so first make sure that is
      # this run's commit. A no-op deploy (a newer main commit is already live
      # on staging, e.g. an old run re-run) leaves the newer build serving, and
      # its smoke would pass this commit on another commit's build. Production
      # would no-op on it too, so nothing is lost by stopping here.
      - name: Staging serves this run's commit
        if: github.event_name == 'push'
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          TO: ${{ steps.deploy.outputs.to }}
          SHA: ${{ github.sha }}
        run: |
          case "$RESULT" in
            deployed|noop) ;;
            *)
              echo "::error title=Staging deploy unconfirmed::the staging deploy reported '$RESULT', not deployed or noop. Production not deployed."
              exit 1
              ;;
          esac
          if [ "$TO" != "$SHA" ]; then
            echo "::error title=Staging serves another commit::the staging deploy reported $RESULT with ${TO:-no commit} serving, not this run's $SHA, so the smoke would check another build. Production not deployed; a newer run deploys its own commit."
            exit 1
          fi
          echo "staging serves $SHA ($RESULT)"

      - name: Staging smoke (read-only, signed out)
        if: github.event_name == 'push'
        timeout-minutes: 2
        env:
          BASE: https://staging-app.logisx.com
        run: bash scripts/deploy/staging-smoke.sh

      # 20 min: ci.yml's job timeout (15) plus room for its runner queue, so the
      # wait never gives up on a CI run that is still allowed to finish.
      - name: CI on main passed on this commit
        if: github.event_name == 'push'
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WAIT_S: "1200"
        run: bash scripts/deploy/wait-for-ci.sh

  production:
    name: production
    needs: [staging]
    # On a push: only after staging succeeds. On a dispatch: runs alone, and the
    # skipped `staging` job must not block it — hence always() + explicit result.
    if: |
      always() && (
        (github.event_name == 'push' && needs.staging.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production's queue, shared with deploy-drift.yml's heal (see the note
    # above `permissions`).
    concurrency:
      group: deploy-refs/heads/main
      cancel-in-progress: false
      queue: max
    # No required reviewer: the staging job above is the gate on a push, and the
    # dispatch gate below on a manual deploy. The environment stays so each
    # deploy is recorded against `production`. A reviewer added here would
    # pause this job holding the production queue again.
    environment:
      name: production
      url: https://app.logisx.com
    # Job-level permissions replace the workflow's: checkout reads the repo, and
    # the dispatch gate reads Deploy runs, their jobs and a failed staging job's
    # annotations (drift-gate.js's lookup).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v5

      # ⚠️ A MANUAL production deploy has no staging job in front of it. It
      # deploys only a commit that passed the staging job of a push-triggered
      # Deploy run (so a rollback to anything main deployed before works), or
      # anything with override=true, recorded as a warning. The gate resolves
      # `ref` to a SHA and the deploy gets exactly that commit.
      - uses: actions/setup-node@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version-file: .nvmrc
      - name: A manual deploy names a commit that passed staging
        id: gate
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.event.inputs.ref }}
          OVERRIDE: ${{ github.event.inputs.override }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/dispatch-gate.js

      - uses: ./.github/actions/vps-deploy
        with:
          dir: /var/www/logistics-app
          pm2: logistics-app
          # A push: main. A dispatch: what the gate resolved (main, or the SHA
          # the ref named).
          ref: ${{ github.event_name == 'push' && 'main' || steps.gate.outputs.ref }}
          # A push: the commit staging just verified, never a newer one. A
          # dispatch of main: the SHA the gate checked; of any other ref: empty,
          # since `ref` is then that SHA itself.
          sha: ${{ github.event_name == 'push' && github.sha || steps.gate.outputs.sha }}
          # unattended: production must recover itself.
          rollback_on_failure: "true"
          public_url: https://app.logisx.com/api/config/maintenance
          ssh_key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
