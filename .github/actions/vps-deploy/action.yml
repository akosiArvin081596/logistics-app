name: VPS deploy
description: >
  Deploy one pm2-managed app on the shared VPS: ssh with transport retry, run the
  versioned remote scripts, smoke-check, and optionally auto-roll-back. Shared by
  deploy.yml's staging and production jobs AND deploy-drift.yml's heal, so no
  path to production can drift from the others.

inputs:
  dir:                 { description: App directory on the VPS,            required: true }
  pm2:                 { description: pm2 process name,                    required: true }
  ref:                 { description: Git ref to deploy,                   required: true }
  sha:                 { description: "Optional full SHA to deploy EXACTLY (ref must be main); empty = ref's tip at pull time", required: false, default: "" }
  rollback_on_failure: { description: "'true' to auto-revert on smoke failure", required: true }
  public_url:          { description: Optional public URL to verify,       required: false, default: "" }
  ssh_key:             { description: Deploy private key,                  required: true }
  known_hosts:         { description: Pinned host key,                     required: true }
  host:                { description: VPS host,                            required: true }
  user:                { description: VPS user,                            required: true }

runs:
  using: composite
  steps:
    # Key setup and the ssh retry helper live in scripts/deploy/ (ssh-setup.sh,
    # ssh-retry.sh), not inline here, so deploy-drift.yml runs the very same
    # copies. The retry budget and the reasoning behind it are in ssh-retry.sh.
    - name: Configure SSH
      shell: bash
      env:
        VPS_SSH_KEY: ${{ inputs.ssh_key }}
        VPS_SSH_KNOWN_HOSTS: ${{ inputs.known_hosts }}
      run: bash scripts/deploy/ssh-setup.sh

    - name: Deploy
      id: deploy
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        DIR:  ${{ inputs.dir }}
        PM2:  ${{ inputs.pm2 }}
        REF:  ${{ inputs.ref }}
        SHA:  ${{ inputs.sha }}
      run: |
        set -euo pipefail
        out=$(bash scripts/deploy/ssh-retry.sh "$USER@$HOST" \
              "DIR='$DIR' PM2='$PM2' REF='$REF' SHA='$SHA' bash -s" < scripts/deploy/remote-deploy.sh | tee /dev/stderr)
        # Capture the pre-deploy SHA so a rollback targets a known-good commit
        # rather than guessing.
        prev=$(printf '%s' "$out" | grep -oE 'DEPLOYED_FROM=[0-9a-f]{7,40}' | tail -1 | cut -d= -f2 || true)
        echo "prev=$prev" >> "$GITHUB_OUTPUT"
        echo "deployed_from=$prev"

    - name: Smoke check
      id: smoke
      shell: bash
      continue-on-error: true
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        DIR:  ${{ inputs.dir }}
        PM2:  ${{ inputs.pm2 }}
      run: |
        set -euo pipefail
        bash scripts/deploy/ssh-retry.sh "$USER@$HOST" "DIR='$DIR' PM2='$PM2' bash -s" < scripts/deploy/remote-smoke.sh

    - name: Public edge check
      id: edge
      if: inputs.public_url != '' && steps.smoke.outcome == 'success'
      shell: bash
      continue-on-error: true
      env:
        PUBLIC_URL: ${{ inputs.public_url }}
      run: |
        set -euo pipefail
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PUBLIC_URL" || true)
        echo "$PUBLIC_URL -> HTTP $code"
        [ "$code" = "200" ] || { echo "::error::public edge returned $code"; exit 1; }

    - name: Auto-rollback
      # Fires only when this target is configured to self-heal AND something
      # actually failed. Nobody is watching an auto-deploy, so production must
      # not be able to stay broken. remote-rollback.sh also records the failed
      # commit in the drift marker, so deploy-drift.yml can never re-deploy it.
      if: |
        inputs.rollback_on_failure == 'true' &&
        (steps.smoke.outcome == 'failure' || steps.edge.outcome == 'failure') &&
        steps.deploy.outputs.prev != ''
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.user }}
        DIR:  ${{ inputs.dir }}
        PM2:  ${{ inputs.pm2 }}
        PREV: ${{ steps.deploy.outputs.prev }}
      run: |
        set -euo pipefail
        echo "::warning::deploy verification failed — rolling $PM2 back to $PREV"
        bash scripts/deploy/ssh-retry.sh "$USER@$HOST" "DIR='$DIR' PM2='$PM2' PREV='$PREV' bash -s" < scripts/deploy/remote-rollback.sh

    - name: Fail the job if verification failed
      # The smoke/edge steps are continue-on-error so the rollback can run first.
      # The job must still go red — a successful rollback is not a successful deploy.
      if: steps.smoke.outcome == 'failure' || steps.edge.outcome == 'failure'
      shell: bash
      env:
        PM2: ${{ inputs.pm2 }}
        SMOKE: ${{ steps.smoke.outcome }}
        EDGE: ${{ steps.edge.outcome }}
        ROLLBACK: ${{ inputs.rollback_on_failure }}
      run: |
        echo "::error::$PM2 failed verification (smoke=$SMOKE edge=$EDGE)."
        echo "rollback_on_failure was '$ROLLBACK'."
        exit 1

    - name: Summary
      if: always()
      shell: bash
      env:
        PM2: ${{ inputs.pm2 }}
        DIR: ${{ inputs.dir }}
        REF: ${{ inputs.ref }}
        SHA: ${{ inputs.sha }}
        PREV: ${{ steps.deploy.outputs.prev }}
        SMOKE: ${{ steps.smoke.outcome }}
        EDGE: ${{ steps.edge.outcome || 'n/a' }}
      run: |
        {
          echo "### $PM2"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| path | \`$DIR\` |"
          echo "| ref | \`$REF\` |"
          echo "| exact SHA | \`${SHA:-(tip of ref at pull time)}\` |"
          echo "| previous SHA | \`$PREV\` |"
          echo "| smoke | $SMOKE |"
          echo "| public edge | $EDGE |"
          echo ""
          echo "Rollback by hand: re-run *Deploy* with **ref** = \`$PREV\`."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Always remove the deploy key
      if: always()
      shell: bash
      run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
